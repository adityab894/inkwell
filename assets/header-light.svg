<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="pill-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="960" height="260" rx="16" fill="url(#bg-light)"/>
  <rect width="958" height="258" x="1" y="1" rx="15" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="960" height="4" rx="2" fill="url(#accent-grad-light)"/>

  <!-- Pen / Quill Logo Emblem -->
  <g transform="translate(68, 70)">
    <rect width="84" height="84" rx="20" fill="url(#pill-grad-light)" stroke="#c7d2fe" stroke-width="1.5"/>
    <path d="M42 16 C30 28, 22 42, 22 56 C22 62, 26 66, 32 66 C40 66, 44 60, 48 52 C52 60, 56 66, 64 66 C70 66, 74 62, 74 56 C74 42, 66 28, 42 16 Z" fill="none" stroke="url(#accent-grad-light)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="46" r="4" fill="#0284c7"/>
    <line x1="42" y1="50" x2="42" y2="68" stroke="url(#accent-grad-light)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(180, 48)">
    <rect width="320" height="26" rx="13" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#7c3aed" letter-spacing="0.08em">✦ 5-MIN PITCH READY · MERN PLATFORM</text>
  </g>

  <!-- Title -->
  <text x="180" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Playfair Display', Georgia, serif" font-size="44" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
    InkWell <tspan fill="#7c3aed">.</tspan>
  </text>

  <!-- Tagline / Pitch Hook -->
  <text x="180" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#475569">
    The high-signal technical publishing platform built for <tspan fill="#0f172a" font-weight="600">AI, DevOps, DevRel &amp; Software Engineering</tspan>.
  </text>

  <!-- Value Metric Pills (Row) -->
  <g transform="translate(180, 182)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="135" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="16" cy="16" r="4" fill="#059669"/>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b">4 Tech Tracks</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="165" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="161" cy="16" r="4" fill="#0284c7"/>
    <text x="173" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Next.js 16 + Express</text>

    <!-- Pill 3 -->
    <rect x="320" y="0" width="145" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="336" cy="16" r="4" fill="#d97706"/>
    <text x="348" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b">MongoDB Atlas</text>

    <!-- Pill 4 -->
    <rect x="475" y="0" width="155" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="491" cy="16" r="4" fill="#db2777"/>
    <text x="503" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Adaptive Dark Mode</text>

    <!-- Pill 5 -->
    <rect x="640" y="0" width="105" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="656" cy="16" r="4" fill="#7c3aed"/>
    <text x="668" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Zero Fluff</text>
  </g>
</svg>

